name: Update MyTV EPG

on:
  workflow_dispatch:

  schedule:
    # 00:17, 06:17, 12:17, 18:17 giờ Việt Nam
    - cron: "17 0,6,12,18 * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: write

jobs:
  generate-epg:
    name: Generate 3-day EPG
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------
      # Generate EPG
      # ------------------------------------------------------

      - name: Generate EPG XML
        run: |
          python MyTV_epg_xml_github.py

      # ------------------------------------------------------
      # Check output
      # ------------------------------------------------------

      - name: Check generated EPG
        run: |
          test -f epg.xml
          echo "epg.xml created successfully"

          echo "File size:"
          du -h epg.xml

          echo "First lines:"
          head -n 10 epg.xml

      # ------------------------------------------------------
      # Commit epg.xml
      # ------------------------------------------------------

      - name: Commit EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg.xml

          if git diff --cached --quiet; then
            echo "EPG không thay đổi."
          else
            git commit -m "Update EPG"
            git push
          fi
