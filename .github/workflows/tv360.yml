name: TV360 EPG

on:
  # Chạy tự động mỗi ngày
  schedule:
    - cron: "10 17 * * *"

  # Cho phép chạy thủ công
  workflow_dispatch:

  # Có thể chạy khi sửa riêng module TV360
  push:
    paths:
      - "tv360/**"
      - ".github/workflows/tv360.yml"

permissions:
  contents: write

jobs:

  tv360:

    name: Fetch TV360 Channels and EPG

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "tv360/requirements.txt"

      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tv360/requirements.txt

      # ------------------------------------------------------
      # Run TV360
      # ------------------------------------------------------

      - name: Run TV360 EPG
        run: |
          python tv360/tv360.py

      # ------------------------------------------------------
      # Show generated files
      # ------------------------------------------------------

      - name: Show generated files
        run: |
          echo "===== TV360 FILES ====="
          ls -lh tv360/

          echo ""
          echo "===== XML SIZE ====="
          wc -c tv360/tv360epg.xml || true

          echo ""
          echo "===== LOG ====="
          head -100 tv360/tv360log.txt || true

      # ------------------------------------------------------
      # Commit changes
      # ------------------------------------------------------

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tv360/

          if git diff --cached --quiet; then
            echo "Không có thay đổi để commit."
            exit 0
          fi

          git commit -m "Update TV360 EPG"

          git push
