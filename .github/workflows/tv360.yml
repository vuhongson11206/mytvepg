name: TV360 EPG

on:
  workflow_dispatch:

  schedule:
    # 03:00 giờ Việt Nam = 20:00 UTC ngày hôm trước
    - cron: "10 0 * * *"

permissions:
  contents: write

jobs:
  tv360:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =====================================================
      # Install packages
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      # =====================================================
      # Run TV360
      # =====================================================

      - name: Run TV360 EPG
        run: |
          python tv360/tv360.py

      # =====================================================
      # Show result
      # =====================================================

      - name: Show TV360 log
        if: always()
        run: |
          echo "======================================"
          echo "TV360 LOG"
          echo "======================================"

          if [ -f tv360/tv360log.txt ]; then
            cat tv360/tv360log.txt
          else
            echo "Không tìm thấy tv360log.txt"
          fi

      # =====================================================
      # Git status
      # =====================================================

      - name: Check Git changes
        run: |
          git status --short

      # =====================================================
      # Commit + Push
      # =====================================================

      - name: Commit and push changes
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tv360/tv360channels.xlsx
          git add tv360/tv360epg.xml
          git add tv360/tv360log.txt

          if git diff --cached --quiet; then
            echo "Không có thay đổi để commit."
            exit 0
          fi

          git commit -m "Update TV360 EPG"

          git pull --rebase origin main

          git push origin HEAD:main
