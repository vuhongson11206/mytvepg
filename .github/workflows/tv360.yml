name: TV360 EPG

on:
  workflow_dispatch:

  schedule:
    # 06:00 giờ Việt Nam
    # GitHub Actions dùng UTC
    - cron: "10 0 * * *"

permissions:
  contents: write

jobs:
  tv360:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =====================================================
      # INSTALL
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl

      # =====================================================
      # RUN TV360
      # =====================================================

      - name: Run TV360 EPG
        run: |
          python tv360/tv360.py

      # =====================================================
      # CHECK FILES
      # =====================================================

      - name: Check generated files
        run: |
          echo "===== TV360 DIRECTORY ====="
          ls -lah tv360/

          echo ""
          echo "===== XML SIZE ====="
          wc -c tv360/tv360epg.xml

          echo ""
          echo "===== LOG ====="
          head -100 tv360/tv360log.txt || true

      # =====================================================
      # COMMIT
      # =====================================================

      - name: Commit TV360 data
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tv360/tv360channels.xlsx
          git add tv360/tv360epg.xml
          git add tv360/tv360log.txt
          git add tv360/tv360_state.json

          if git diff --cached --quiet; then
            echo "Không có thay đổi để commit."
            exit 0
          fi

          git commit -m "Update TV360 EPG"

      # =====================================================
      # PUSH
      # =====================================================

      - name: Push changes
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
